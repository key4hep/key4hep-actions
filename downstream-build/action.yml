name: 'Build downstream'
description: 'Build dependent packages and branches'
runs:
  using: "composite"
  steps:
    - name: Start container
      shell: bash
      run: |
        docker run -it --name container --privileged -v ${GITHUB_WORKSPACE}:/Package/${{ github.event.repository.name }} -d ghcr.io/key4hep/key4hep-images/alma9-cvmfs /bin/bash

    - shell: bash
      run: |
        echo $PWD
        ls -lah
        cat <<'EOF' > ${GITHUB_WORKSPACE}/script_container.sh
        cd ./Package

        source /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh

        git clone https://github.com/key4hep/key4hep-dev-utils --depth 1 -q
        mkdir /Workarea
        cd /Workarea
        python3 /Package/key4hep-dev-utils/scripts/fetch_and_checkout.py ${{ github.repository }} || exit 1

        # If there aren't any packages leave
        if [ -z "$(ls /Workarea)" ]; then
            echo "No packages depend on this one, exiting"
            exit 0
        fi

        status=0
        cd /Package/${{ github.event.repository.name }}
        mkdir build
        cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=../install -DCMAKE_CXX_STANDARD=23 -DBUILD_TESTING=OFF -G Ninja
        ninja && ninja install > /dev/null
        build_ret=$?
        if [ $build_ret -ne 0 ]; then
            status=1
        fi
        # Do not run the tests, this is already done in other CI workflows
        # ctest -j $(nproc) --output-on-failure
        cd ..
        k4_local_repo

        cd /Workarea
        # The clones are named NN_<name> so that sorting them gives the build order,
        # but k4_local_repo needs each repository to be in a directory with its own name
        for clone in $(ls)
        do
            package=$(basename $(git -C $clone remote get-url origin) .git)
            mv $clone $package
            cd $package
            mkdir build
            cd build

            # Set cmake flags for downstream packages
            cmake_extra_flags=""
            if [[ "${package,,}" == *"dd4hep"* ]]; then
                cmake_extra_flags="$cmake_extra_flags -DDD4HEP_USE_GEANT4=ON -DDD4HEP_USE_XERCESC=ON -DDD4HEP_USE_LCIO=ON -DDD4HEP_USE_EDM4HEP=ON -DDD4HEP_BUILD_EXAMPLES=ON -DDD4HEP_BUILD_PACKAGES=DDG4 DDCond DDCAD DDRec DDDetectors DDAlign DDDigi DDEve UtilityApps"
            fi

            cmake .. $cmake_extra_flags -DCMAKE_INSTALL_PREFIX=../install -DCMAKE_CXX_STANDARD=23 -G Ninja
            ninja && ninja install > /dev/null
            build_ret=$?
            if [ $build_ret -eq 0 ]; then
                ctest -j $(nproc) --output-on-failure
                test_ret=$?
            else
                test_ret=1
                echo "Build failed for $package, skipping tests"
            fi
            if [ $build_ret -ne 0 ] || [ $test_ret -ne 0 ]; then
                status=1
            fi
            cd ..
            k4_local_repo
            cd /Workarea
        done
        exit $status

        EOF

        cat ${GITHUB_WORKSPACE}/script_container.sh

        docker exec container /bin/bash /Package/${{ github.event.repository.name }}/script_container.sh
