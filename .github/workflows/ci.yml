name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        build_type: ["nightly"]
        image: ["alma9", "alma10", "ubuntu26"]
        include:
          - image: alma10
            stack: /cvmfs/sft-nightlies.cern.ch/lcg/views/devkey-head/latest/x86_64-el10-gcc16-opt/setup.sh
      fail-fast: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/${{ matrix.image }}-cvmfs
      options: --privileged
      volumes:
        - /home/runner/.cache/ccache:/root/.cache/ccache
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    - name: Mount CVMFS
      run: /mount.sh
    - uses: ./key4hep-build
      with:
        build_type: ${{ matrix.build_type }}
        image: ${{ matrix.image }}
        stack: ${{ matrix.stack }}
